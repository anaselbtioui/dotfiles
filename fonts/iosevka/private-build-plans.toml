# Restrained custom Iosevka for this machine.
# No ligatures. Normal width. Sans. Term spacing (terminal-friendly).
# Rebuild: see docs/fonts.md
#
# Variant keys taken from Iosevka v34 composite.ss* designs so names stay valid.
# Choices favour character distinction without ornament.

[buildPlans.IosevkaQuiet]
family = "Iosevka Quiet"
spacing = "term"
serifs = "sans"
exportGlyphNames = false

[buildPlans.IosevkaQuiet.variants.design]
a = "double-storey-serifless"
g = "double-storey"
i = "serifed"
l = "serifed"
zero = "dotted"
one = "base"
asterisk = "penta-low"
brace = "straight"
paren = "normal"
at = "fourfold"
percent = "dots"
number-sign = "upright"
ampersand = "closed"
question = "smooth"
dollar = "open"
capital-g = "toothless-corner-serifless-hooked"
capital-q = "straight"
capital-r = "straight-serifless"

[buildPlans.IosevkaQuiet.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.IosevkaQuiet.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.IosevkaQuiet.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.IosevkaQuiet.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"

[buildPlans.IosevkaQuiet.widths.Normal]
shape = 500
menu = 5
css = "normal"
